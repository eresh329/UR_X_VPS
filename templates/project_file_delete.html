{% extends "project_base.html" %}
{% block pbody %}
<div class="panel danger center narrow rv" style="--i:2;padding:40px 26px">
  <div class="bigico">{{ ic('trash', 38) }}</div>
  <h2 style="justify-content:center;font-size:22px">Delete this {{ 'folder' if is_dir else 'file' }}?</h2>
  <p class="muted" style="margin-top:8px">This cannot be undone{{ ' and removes everything inside it' if is_dir }}.</p>
  <div class="codebox">{{ rel }}</div>
  <form method="POST" action="{{ url_for('project_action', name=server_name, action='rmfile') }}" style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:30px">
    <input type="hidden" name="filename" value="{{ rel }}">
    <button class="btn bad lg" type="submit">{{ ic('trash', 17) }}Yes, delete</button>
    <a class="btn lg" href="{{ url_for('project_files', name=server_name) }}">Keep it</a>
  </form>
</div>
{% endblock %}
